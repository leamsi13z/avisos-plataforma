<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Avisos & Novedades - Neon City</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Paleta de colores ajustada para el fondo neón */
      --bg-dark: #050509; /* Un negro casi puro para la base */
      --card-bg: rgba(13, 17, 23, 0.85); /* Fondo de tarjeta oscuro y ligeramente transparente */
      --card-border: rgba(56, 189, 248, 0.3); /* Borde cian neón sutil */
      --primary: #6366f1; /* Índigo para elementos principales */
      --text-main: #f8fafc; /* Blanco frío para texto principal */
      --text-muted: #cbd5e1; /* Gris claro para texto secundario */
      --accent: #38bdf8; /* Cian neón para acentos */
      --neon-glow: 0 0 10px rgba(56, 189, 248, 0.5); /* Resplandor neón */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      /* Aplicando la imagen de fondo ciberpunk */
      background-image: url('https://i.pinimg.com/1200x/d9/46/3d/d9463d5b43c40cd147a5f92f99856d11.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed; /* Mantiene el fondo fijo al hacer scroll */
      background-repeat: no-repeat;
      padding: 2.5rem 1rem;
    }

    /* Capa de superposición para mejorar la legibilidad si es necesario */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.3); /* Capa oscura sutil */
      z-index: -1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative; /* Para asegurar que el contenido esté sobre la capa de superposición */
      z-index: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 1rem;
      background: rgba(13, 17, 23, 0.6); /* Fondo ligero para el encabezado */
      padding: 1.5rem;
      border-radius: 12px;
      backdrop-filter: blur(5px); /* Efecto de desenfoque detrás del encabezado */
      box-shadow: var(--neon-glow);
    }

    .header-title h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      text-shadow: var(--neon-glow); /* Efecto neón en el título */
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 0.35rem;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent);
      padding: 0.6rem 1.2rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 600;
      box-shadow: var(--neon-glow);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #10b981; /* Verde esmeralda para 'Conectado' */
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }

    .grid-avisos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2rem;
    }

    .aviso-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px); /* Efecto de cristal esmerilado */
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .aviso-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px -10px rgba(56, 189, 248, 0.4);
      border-color: rgba(56, 189, 248, 0.6);
    }

    .aviso-img-wrapper {
      position: relative;
      width: 100%;
      height: 210px;
      overflow: hidden;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .aviso-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .aviso-card:hover .aviso-img {
      transform: scale(1.08);
    }

    .aviso-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .aviso-fecha {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.7rem;
      text-shadow: 0 0 5px rgba(56, 189, 248, 0.5);
    }

    .aviso-titulo {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
      line-height: 1.3;
      color: var(--text-main);
    }

    .aviso-texto {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.2rem;
      flex-grow: 1;
    }

    .aviso-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Estilos para el estado de carga (skeletons) */
    .skeleton-card {
      height: 380px;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 0.3; }
    }

    /* Ajustes para pantallas pequeñas */
    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem;
      }
      .header-title h1 {
        font-size: 1.6rem;
      }
      .grid-avisos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <h1>Tablero de Avisos</h1>
        <p>Sincronizado en tiempo real desde Google Sheets</p>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Conectado</span>
      </div>
    </header>

    <main id="avisos-container" class="grid-avisos">
      <!-- Tarjetas de carga (skeletons) que se muestran antes de los datos -->
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </main>
  </div>

  <script>
    // Tu enlace de Apps Script actualizado
    const API_URL = 'https://script.google.com/macros/s/AKfycbx5OVdBDbBhT6pvlHZoBExxBpjSL2iP79q_yPTwNvJCPT6bHQ5wfu007fMYf29D96Kn/exec';

    async function cargarAvisos() {
      const container = document.getElementById('avisos-container');

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Error HTTP: ' + response.status);
        
        const avisos = await response.json();
        renderAvisos(avisos);
      } catch (error) {
        console.error('Error al conectar:', error);
        container.innerHTML = `
          <div style="grid-column: 1/-1; background: rgba(239, 68, 68, 0.15); border: 1px solid #f87171; padding: 2rem; border-radius: 15px; box-shadow: 0 0 15px rgba(248, 113, 113, 0.3);">
            <p style="color: #f87171; font-weight: 700; font-size: 1.2rem; margin-bottom: 0.8rem;">⚠️ No se pudieron cargar los avisos</p>
            <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.5;">Detalle técnico: ${error.message}</p>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 1rem;">Por favor, verifica la conexión o intenta nuevamente más tarde.</p>
          </div>
        `;
      }
    }

    function renderAvisos(avisos) {
      const container = document.getElementById('avisos-container');
      container.innerHTML = ''; // Limpia los skeletons

      if (!avisos || avisos.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 2rem; background: rgba(13, 17, 23, 0.6); border-radius: 12px;">No hay avisos registrados en la hoja actualmente.</p>';
        return;
      }

      avisos.forEach(aviso => {
        const card = document.createElement('article');
        card.className = 'aviso-card';

        // Estructura de la imagen con manejo de error
        const imageHTML = aviso.imagen 
          ? `<div class="aviso-img-wrapper">
               <img src="${aviso.imagen}" alt="${aviso.titulo || 'Aviso'}" class="aviso-img" loading="lazy" onError="this.parentElement.style.display='none'">
             </div>`
          : '';

        // Formateo sutil de la fecha (asumiendo formato ISO o similar)
        let fechaFormateada = aviso.fecha || '';
        if (fechaFormateada.includes('T')) {
          fechaFormateada = fechaFormateada.split('T')[0];
        }

        card.innerHTML = `
          ${imageHTML}
          <div class="aviso-body">
            <span class="aviso-fecha">📅 ${fechaFormateada}</span>
            <h2 class="aviso-titulo">${aviso.titulo || 'Sin título'}</h2>
            <p class="aviso-texto">${aviso.texto || ''}</p>
            <div class="aviso-footer">
              <span>Vía Google Sheets</span>
              <span style="color: var(--accent); font-weight: 600;">#NeonCity</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Cargar los avisos cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', cargarAvisos);
  </script>
</body>
</html>
